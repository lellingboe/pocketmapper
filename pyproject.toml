[project]
name = "pocketmapper"
version = "0.2.6"
dependencies = [
    "biopython>=1.80",
    "numpy>=1.24",
    "pandas>=2.0",
    "tqdm>=4.64",
    "gemmi>=0.6.4",
]
requires-python = ">=3.10"
authors = [
  {name="Lachlan Ellingboe", email="Lachlan.Ellingboe@icr.ac.uk"},
]
description = "A tool for mapping surface pockets in PDB structures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]


[project.optional-dependencies]
dev = [
  "bump-my-version",
  "pre-commit",
  "ruff",
]

[project.scripts]
pocketmapper = "pocketmapper.cli:cli"

[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pocketmapper*"]

[tool.setuptools.package-data]
pocketmapper = [
  "blosum62.bla",
  "human_domains/*",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.bumpversion]
current_version = "0.2.6"
commit = true
tag = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "pocketmapper/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
